# ==============================================================================
# 1. HỆ THỐNG TUYỂN DỤNG ATS (tuyendung.noveratech.digital)
# ==============================================================================

# Chuyển hướng toàn bộ HTTP sang HTTPS và hỗ trợ Let's Encrypt Certbot
server {
    listen 80;
    listen [::]:80;
    server_name tuyendung.noveratech.digital;

    # Hỗ trợ Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tuyendung.noveratech.digital;

    # Đường dẫn chứng chỉ SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/tuyendung.noveratech.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuyendung.noveratech.digital/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Bảo mật Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy tới container ASP.NET Core
    location / {
        proxy_pass http://ats-web:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket / SignalR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy buffer tối ưu cho OpenID Connect / OIDC cookie lớn (Chống lỗi 502 Bad Gateway)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ==============================================================================
# 2. HỆ THỐNG QUẢN LÝ ĐỊNH DANH SSO (sso.noveratech.digital)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sso.noveratech.digital;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sso.noveratech.digital;

    ssl_certificate /etc/letsencrypt/live/sso.noveratech.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sso.noveratech.digital/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Phục vụ file giao diện tùy biến nhận diện NoveraTech (Level 2)
    location /custom/ {
        alias /etc/nginx/custom/;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy tới container Authelia SSO
    location / {
        proxy_pass http://authelia:9091;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept-Encoding "";

        # Level 2 Customization: Tùy biến Tiêu đề & Nhận diện NoveraTech
        sub_filter '<title></title>' '<title>NoveraTech ID · Cổng Định Danh & Xác Thực Nội Bộ</title>';
        sub_filter '</head>' '<link rel="stylesheet" href="/custom/noveratech-sso.css?v=20261010_4"><script defer src="/custom/noveratech-bg.js?v=20261010_1"></script></head>';
        sub_filter_once off;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Proxy buffer tối ưu cho Authelia SSO
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
