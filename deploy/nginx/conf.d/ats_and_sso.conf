# ==============================================================================
# 1. HỆ THỐNG TUYỂN DỤNG ATS (tuyendung.noveratech.digital)
# ==============================================================================

# Chuyển hướng toàn bộ HTTP sang HTTPS và hỗ trợ Let's Encrypt Certbot
server {
    listen 80;
    listen [::]:80;
    server_name tuyendung.noveratech.digital;

    # Hỗ trợ Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tuyendung.noveratech.digital;

    # Đường dẫn chứng chỉ SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/tuyendung.noveratech.digital/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuyendung.noveratech.digital/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Bảo mật Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy tới container ASP.NET Core
    location / {
        proxy_pass http://ats-web:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # WebSocket / SignalR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

