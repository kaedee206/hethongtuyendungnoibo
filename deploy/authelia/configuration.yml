###############################################################################
# AUTHELIA CONFIGURATION FOR NOVERATECH SSO (0-COST, ULTRA-LIGHTWEIGHT ~50MB)
###############################################################################

server:
  host: 0.0.0.0
  port: 9091

log:
  level: info

telemetry:
  metrics:
    enabled: false

theme: dark

# 1. Quản lý phiên làm việc SSO (Session Cookie)
session:
  name: authelia_session
  domain: noveratech.digital
  same_site: lax
  expiration: 1h
  inactivity: 30m
  remember_me: 1M
  cookies:
    - domain: noveratech.digital
      authelia_url: https://sso.noveratech.digital
      default_redirection_url: https://tuyendung.noveratech.digital

# 2. Cơ sở dữ liệu người dùng (File Backend siêu nhẹ - 0 MB overhead)
authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
    watch: true
    password:
      algorithm: argon2id
      iterations: 3
      key_length: 32
      salt_length: 16
      memory: 64

# 3. Phân quyền truy cập
access_control:
  default_policy: deny
  rules:
    # Cho phép truy cập cổng SSO
    - domain:
        - "sso.noveratech.digital"
      policy: bypass
    # Bắt buộc xác thực với hệ thống tuyển dụng
    - domain:
        - "tuyendung.noveratech.digital"
      policy: one_factor

# 4. Storage Engine (Sử dụng PostgreSQL nội bộ của VPS)
storage:
  postgres:
    host: postgres
    port: 5432
    database: authelia_db
    username: postgres
    password: authelia_db_secure_password_change_me
    timeout: 5s

# 5. Thông báo / Notifier (Gửi link qua file log nội bộ hoặc SMTP)
notifier:
  filesystem:
    filename: /config/notification.txt

# 6. OPENID CONNECT PROVIDER (OIDC / OAuth 2.0)
identity_providers:
  oidc:
    hmac_secret: novera_hmac_secret_key_change_me_32chars_long!
    issuer: https://sso.noveratech.digital
    access_token_lifespan: 1h
    authorize_code_lifespan: 5m
    id_token_lifespan: 1h
    refresh_token_lifespan: 24h
    enable_client_debug_messages: false
    minimum_parameter_entropy: 8
    
    # Danh sách client đăng ký kết nối SSO
    clients:
      - client_id: ats_portal
        client_name: NoveraTech Internal Recruitment Portal
        # Hash argon2id của secret: novera_ats_secret_2026
        # Tạo bằng lệnh: docker run authelia/authelia:latest authelia crypto hash generate argon2 --password 'novera_ats_secret_2026'
        client_secret: "$argon2id$v=19$m=65536,t=3,p=4$qFq8P2yM0WvD1s5H$V9Z3M+ZpD0H9kU3J8y3L8a7m2p1v0x9s8b7n6c5m4l3"
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://tuyendung.noveratech.digital/signin-oidc
          - https://tuyendung.noveratech.digital/Account/ExternalCallback
          - http://localhost:5000/signin-oidc
        scopes:
          - openid
          - profile
          - email
          - groups
        userinfo_signed_response_alg: none
