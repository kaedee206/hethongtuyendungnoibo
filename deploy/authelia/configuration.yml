###############################################################################
# AUTHELIA CONFIGURATION FOR NOVERATECH SSO (0-COST, ULTRA-LIGHTWEIGHT ~50MB)
###############################################################################

server:
  address: 'tcp://0.0.0.0:9091/'
  asset_path: /config/assets

log:
  level: info

telemetry:
  metrics:
    enabled: false

theme: dark

# 1. Quản lý phiên làm việc SSO (Session Cookie)
session:
  name: authelia_session
  same_site: lax
  expiration: 1h
  inactivity: 30m
  remember_me: 1M
  # Secret tối thiểu 32 ký tự bắt buộc từ Authelia v4.38+
  secret: novera_authelia_session_secret_32_characters_long_2026!
  cookies:
    - domain: noveratech.digital
      authelia_url: https://sso.noveratech.digital
      default_redirection_url: https://tuyendung.noveratech.digital

# 2. Cơ sở dữ liệu người dùng (File Backend siêu nhẹ - 0 MB overhead)
authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml
    watch: true
    password:
      algorithm: argon2id
      iterations: 3
      key_length: 32
      salt_length: 16
      memory: 64

# 3. Phân quyền truy cập
access_control:
  default_policy: deny
  rules:
    # Cho phép truy cập cổng SSO
    - domain:
        - "sso.noveratech.digital"
      policy: bypass
    # Bắt buộc xác thực với hệ thống tuyển dụng
    - domain:
        - "tuyendung.noveratech.digital"
      policy: one_factor

# 4. Storage Engine (Sử dụng PostgreSQL nội bộ của VPS)
storage:
  encryption_key: storage_key_change_me_random_32_characters_long
  postgres:
    address: 'tcp://postgres:5432'
    database: authelia_db
    username: postgres
    password: postgres_secure_pass_2026
    timeout: 5s

# 5. Thông báo / Notifier (Gửi link qua file log nội bộ hoặc SMTP)
notifier:
  filesystem:
    filename: /config/notification.txt

# Khóa JWT cho xác thực danh tính
identity_validation:
  reset_password:
    jwt_secret: jwt_secret_token_change_me_super_random_32_chars

