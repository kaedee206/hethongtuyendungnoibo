services:
  # 1. Cơ sở dữ liệu PostgreSQL dùng chung (tiết kiệm RAM tối đa)
  postgres:
    image: postgres:16-alpine
    container_name: ats-postgres
    restart: always
    environment:
      POSTGRES_DB: ats_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 300M
    networks:
      - novera-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Hệ thống định danh SSO Authelia (Go - siêu nhẹ ~50MB)
  authelia:
    image: authelia/authelia:latest
    container_name: ats-authelia-sso
    restart: always
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml
      - ./authelia/users_database.yml:/config/users_database.yml
      - ./authelia/assets:/config/assets
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:-novera_authelia_session_secret_32_characters_long_2026!}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:-jwt_secret_token_change_me_super_random_32_chars}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:-storage_key_change_me_random_32_characters_long}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET:-novera_hmac_secret_key_change_me_32chars_long!}
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 120M
    networks:
      - novera-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Ứng dụng Tuyển dụng ASP.NET Core 9 (Ats.Web)
  ats-web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ats-web-app
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:-https://sso.noveratech.digital}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ats_portal}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      INTERNAL_EMAIL_DOMAIN: ${INTERNAL_EMAIL_DOMAIN:-@noveratech.digital}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SESSION_IDLE_TIMEOUT_MINUTES: "30"
    volumes:
      - ats_uploads:/app/wwwroot/uploads
      - ats_dataprotection_keys:/app/dataprotection-keys
    depends_on:
      - postgres
      - authelia
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 450M
    networks:
      - novera-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  novera-network:
    name: novera_network
    external: true

volumes:
  postgres_data:
    name: ats_postgres_data
  ats_uploads:
    name: ats_uploads_data
  ats_dataprotection_keys:
    name: ats_dataprotection_keys
