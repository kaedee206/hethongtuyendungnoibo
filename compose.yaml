services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - uploads_data:/app/wwwroot/uploads
    networks:
      - ats-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ats-nginx:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - web
    networks:
      - ats-network

networks:
  ats-network:
    name: ats_network
    driver: bridge

volumes:
  uploads_data:
    name: ats_uploads_data
