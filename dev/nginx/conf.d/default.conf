upstream ats_backend {
    server web:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Kích thước tối đa file gửi lên (CV, hồ sơ ứng viên, avatar)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Bảo mật HTTP Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint kiểm tra trạng thái Nginx
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Định tuyến toàn bộ request đến ứng dụng ASP.NET Core
    location / {
        proxy_pass http://ats_backend;
        proxy_http_version 1.1;

        # Forwarded Headers cho ASP.NET Core nhận diện đúng IP và Protocol của Client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Hỗ trợ WebSockets / SignalR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # Cấu hình Timeout phù hợp cho xử lý DB và upload file lớn
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer tối ưu
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
