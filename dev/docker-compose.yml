services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ats-web-dev
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    volumes:
      - ats_dev_uploads:/app/wwwroot/uploads
    restart: unless-stopped
    networks:
      - ats-dev-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ats-nginx-dev:latest
    container_name: ats-nginx-dev
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - ats-dev-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ats-dev-network:
    name: ats_dev_network
    driver: bridge

volumes:
  ats_dev_uploads:
    name: ats_dev_uploads_data
